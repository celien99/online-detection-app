[project]
name = "seat-defect-core"
version = "0.1.0"
description = "Online real-time seat defect inspection core"
requires-python = ">=3.11"
dependencies = [
    "anomalib>=1.0.0",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "ultralytics>=8.2.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["seat_defect_core", "seat_defect_core.*"]
