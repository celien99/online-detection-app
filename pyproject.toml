[project]
name = "online-detection-app"
version = "0.1.0"
description = "Industrial online seat defect detection program"
requires-python = ">=3.11"
dependencies = [
    "seat_defect_core",
    "pyside6>=6.6.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pymodbus>=3.6.0",
    "structlog>=24.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
]
packaging = [
    "pyinstaller>=6.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.uv.sources]
seat_defect_core = { path = "seat_defect_core" }
